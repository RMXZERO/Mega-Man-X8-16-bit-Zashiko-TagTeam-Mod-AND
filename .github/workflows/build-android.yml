name: Build Android (APK)

# 수동 실행: Actions 탭 → "Build Android (APK)" → Run workflow
on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: "Godot 버전 (프로젝트는 3.5 계열)"
        default: "3.5.3"
      package_name:
        description: "패키지 이름"
        default: "com.mmx8.teamtag.AND"

env:
  GODOT_VERSION: ${{ github.event.inputs.godot_version }}
  ANDROID_PACKAGE: ${{ github.event.inputs.package_name }}
  APP_NAME: MMX8

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Godot 3.5 의 APK 서명(jarsigner/keytool)은 JDK 11 기준
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Android SDK 구성요소 설치
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;30.0.3" "platforms;android-29"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Godot + Android 내보내기 템플릿 설치
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip     "$BASE/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip" || \
            curl -fL -o godot.zip   "$BASE/Godot_v${GODOT_VERSION}-stable_x11.64.zip"
          curl -fL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_* "$PWD/godot_bin" 2>/dev/null || true
          GODOT_BIN="$(ls "$PWD"/Godot_v* "$PWD/godot_bin" 2>/dev/null | head -1)"
          chmod +x "$GODOT_BIN"
          TPL="$HOME/.local/share/godot/templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL/"
          ls "$TPL" | grep -i android
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: 디버그 키스토어 + 에디터 설정
        run: |
          set -eux
          keytool -genkey -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-3.tres" <<EOF2
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF2
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-3.tres"
          cat "$HOME/.config/godot/editor_settings-3.tres"

      - name: 소스 전처리 (ETC 텍스처 / 한글 / Android 프리셋)
        run: python3 ci/android_prepare.py

      - name: 리소스 임포트
        run: |
          mkdir -p build/android
          touch build/.gdignore
          # .import 캐시가 없으므로 첫 실행은 임포트만 하고 실패해도 무시
          "$GODOT" --path . --no-window --export-debug "Android" "$PWD/build/android/${APP_NAME}.apk" || true

      - name: APK 내보내기
        run: |
          set -eux
          "$GODOT" --path . --no-window --export-debug "Android" "$PWD/build/android/${APP_NAME}.apk"
          ls -lh build/android

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-android-apk
          path: build/android/${{ env.APP_NAME }}.apk
          if-no-files-found: error
